server {
    listen 80;
    server_name _;
    server_tokens off;

    index index.php index.html;

    # Both indicators are intentionally stored in the backend bind mount, so
    # Nginx can enter maintenance mode without contacting PHP-FPM, Laravel,
    # Redis, or MySQL. The legacy path remains active during the transition.
    #
    # The only directive used inside the `if` blocks below is `return`; this
    # is a safe use of ngx_http_rewrite_module and terminates the request
    # before any upstream or SPA fallback is reached.
    set $centra_deploy_maintenance_legacy_flag /var/www/storage/framework/centra-deploy-maintenance.flag;
    set $centra_deploy_maintenance_flag /var/www/.deploy-maintenance/maintenance.flag;

    # Internal-only maintenance payloads. `=503` on the error_page directives
    # below preserves the maintenance status instead of converting it to 200.
    location = /_centra-maintenance.html {
        internal;
        alias /var/www/docker/nginx/html/maintenance.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Retry-After "60" always;
    }

    location = /_centra-api-maintenance.json {
        internal;
        default_type application/json;
        alias /var/www/docker/nginx/html/maintenance.json;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Retry-After "60" always;
    }

    # ==================================================
    # FRONTEND (SPA)
    # ==================================================
    root /var/www/html/frontend;

    location / {
        if (-f $centra_deploy_maintenance_legacy_flag) {
            return 503;
        }
        if (-f $centra_deploy_maintenance_flag) {
            return 503;
        }

        error_page 503 =503 /_centra-maintenance.html;
        try_files $uri $uri/ /index.html;
    }

    # Static files (frontend cache)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        if (-f $centra_deploy_maintenance_legacy_flag) {
            return 503;
        }
        if (-f $centra_deploy_maintenance_flag) {
            return 503;
        }

        error_page 503 =503 /_centra-maintenance.html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }

    # ==================================================
    # BACKEND (Laravel bajo /api)
    # ==================================================
    location = /api {
        if (-f $centra_deploy_maintenance_legacy_flag) {
            return 503;
        }
        if (-f $centra_deploy_maintenance_flag) {
            return 503;
        }

        error_page 503 =503 /_centra-api-maintenance.json;
        root /var/www/public;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /api/ {
        if (-f $centra_deploy_maintenance_legacy_flag) {
            return 503;
        }
        if (-f $centra_deploy_maintenance_flag) {
            return 503;
        }

        error_page 503 =503 /_centra-api-maintenance.json;
        root /var/www/public;

        # `^~ /api/` preserves Laravel paths with extensions (for example,
        # .js), so PHP must be denied explicitly in this location as well.
        # This nested regex is evaluated before the parent `try_files` and
        # blocks both direct PHP requests and PHP path-info requests.
        location ~* \.php(?:/|$) {
            if (-f $centra_deploy_maintenance_legacy_flag) {
                return 503;
            }
            if (-f $centra_deploy_maintenance_flag) {
                return 503;
            }

            error_page 503 =503 /_centra-api-maintenance.json;
            return 404;
        }

        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        root /var/www/public;
        fastcgi_pass centra-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        internal;
    }

    # Bloquear acceso directo a otros .php
    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
